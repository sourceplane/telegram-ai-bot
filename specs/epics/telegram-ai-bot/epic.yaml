# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (TB → TB-1, TB-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: telegram-ai-bot
  key: TB
spec:
  title: "TBXark's ChatGPT-Telegram-Workers on one Cloudflare Worker with Workers KV and Workers AI"
  summary: "TBXark's ChatGPT-Telegram-Workers — a Telegram bot that answers in private and group chats with any of several model APIs, streams its replies, draws images, runs custom commands and plugins, and is configured from a Telegram Mini-App admin page — runs as one Cloudflare Worker deployed by Orun, its settings and chat history in a Workers KV namespace Terraform provisions per environment, Workers AI its keyless default model through the Worker's own AI binding, and the bot token an optional Orun secret the deploy hands to the Worker and binds to Telegram's webhook. Then it becomes an Orun baseline that takes a new bot from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "TB0 — the spec"
      exitCriteria:
        - "the repository has its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [TB-1]
    - name: "TB1 — the bot on Workers"
      exitCriteria:
        - "apps/bot is the upstream Workers entry over the upstream libraries in packages/, built by wrangler into one Worker that loads as dependency-free ESM"
        - "with no bot token the Worker serves its home page, its admin page and /health, which says to connect a bot token; with one, a Telegram update posted to its webhook is answered"
        - "Workers AI answers through the AI binding when no vendor key is configured, and the admin page adds any other provider as upstream does"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green"
      tasks: [TB-2]
    - name: "TB2 — the KV namespace from Terraform"
      exitCriteria:
        - "infra/terraform/cloudflare-kv provisions the stage and prod namespaces and publishes the wiring document the Worker's config renders from; the deploy waits for it"
      tasks: [TB-3]
    - name: "TB3 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, connect a bot and deploy it, and how every piece maps from the upstream's Cloudflare deploy"
        - "the as-built status records every departure from the upstream"
      tasks: [TB-4]
    - name: "TB4 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new bot from nothing to live on stage and prod in one landing, then record it"
        - "a product built from it carries the product only, renamed throughout to its own name, repository, Worker and namespace names, with the upstream's MIT licence intact"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the stage lanes' steps in staged job trees, the Worker served with no token and against a stand-in Telegram API and model API"
      tasks: [TB-5]
