# The telegram-ai-bot card: what the console's Blueprints page renders and
# the platform's bootstrap door consumes.
#
# THIS FILE IS NOT THE BUILD. `spec.bootstrap.blueprint` names the build
# document — `repo-blueprint.yaml`, whose phases a runner places. This card is
# what an operator reads and fills in before pressing Build, and
# `testing/manifest.test.sh` compares every list below to the document that
# actually does the thing, not to a copy of itself.
#
# The division of labour with the registry is strict: the registry (orun-cloud
# `infra/baselines-registry/baselines.yaml`) owns identity and commerce — id,
# visibility, tier, the pinned tag. This file owns the build contract. Neither
# restates the other, which is why there is no `tag` here: this file is
# fetched AT the tag the registry pins.
apiVersion: orun.io/v1
kind: Blueprint
metadata:
  name: telegram-ai-bot
  displayName: Telegram AI Bot — a multi-model Telegram bot on one Cloudflare Worker
  description: >
    TBXark's ChatGPT-Telegram-Workers as a product of its own: a Telegram bot
    that answers in private and group chats, streams its replies, draws
    images and runs custom commands and plugins, managed from a Telegram
    Mini-App — one Cloudflare Worker, Workers AI its keyless default model
    through the Worker's own binding, its settings and chat history in a
    Workers KV namespace Terraform provisions per environment, and CI that
    applies the namespace and deploys the bot to stage and prod on merge.
    The bot token connects after the build, as an Orun secret; the deploy
    binds Telegram's webhook. One provider, one consent, one token. Live in
    about eight minutes, in one landing.
  tags: [telegram, bot, ai, workers-ai, kv, cloudflare, terraform]
spec:
  source:
    repo: sourceplane/telegram-ai-bot
    # No `tag`. The registry pins it; this file is fetched at it.

  # ── What the operator reads first ────────────────────────────────────────
  overview:
    lede: >
      A Telegram bot on one Cloudflare Worker that answers with Workers AI
      before you have a vendor key, and adds OpenAI, Anthropic or any
      compatible API from its Mini-App admin. Store the bot token and
      redeploy: the deploy binds the webhook.
    architecture:
      - layer: Edge
        items: [bot]
      - layer: Data
        items: [Workers KV (cloudflare-kv), Workers AI]
      - layer: Delivery
        items: [GitHub Actions, wrangler, Terraform]
    outcome:
      - Live on stage and prod, in one landing
      - The KV namespace applied before the Worker that binds it
      - Answers with Workers AI, no vendor key
      - Every merge redeploys, binds the webhook, smoke-tested

  requires:
    # Cloudflare is the only provider connection a bootstrap needs. GitHub
    # arrives as the App installation plus the repo link, not as a
    # connection row.
    integrations: [github, cloudflare]
    apiKeyRole: admin          # secret writes need the admin floor

  # Every input is collected by the console: keys are lowercase (the
  # platform's reader refuses anything else), every one carries the `pattern`
  # its value is checked against before Continue, and a value the console
  # already holds says so with `from`. repo-blueprint.yaml declares the same
  # names; `repoPrivate`, `orunWorkspace` and `epicSlug` are build inputs with
  # defaults (or filled from the build's workspace) and are not asked.
  #
  # NOR IS THE DOMAIN. The bot goes live on workers.dev, and a domain is an
  # owner's step after the bootstrap: `productdomain` defaults to empty, the
  # rebrand writes the reserved placeholder `<reponame>.example.com` where
  # the domain goes, and the bot's README ("Custom domain") says how to
  # set it. Nothing that needs a domain is removed — it waits for one.
  #
  # NOR IS THE BOT TOKEN. It is the bot owner's, from @BotFather, and no
  # provider mints it: a product deploys and serves without it, and its
  # README ("Connecting a bot") says how to store it and redeploy.
  inputs:
    - key: reponame
      label: Repo name
      pattern: "^[a-z][a-z0-9-]{1,38}$"
      # The operator picked the repository; its name IS this value.
      from: repo.name
    - key: productname
      label: Bot name
      pattern: "^[A-Za-z0-9][A-Za-z0-9 .,'&-]{1,48}$"
      help: The name on the bot's pages — their title and heading — and what /health answers with.
      example: Acme Assistant
    - key: githuborg
      label: GitHub organisation
      pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
      help: The GitHub org or user the bot's repository is created under.
      # DERIVED FROM THE CHOSEN REPOSITORY: its owner IS this value. Declared
      # because repo-blueprint.yaml requires it — a build may declare more
      # inputs than this card, but not require one nobody supplies.
      from: repo.owner
    - key: subdomain
      label: workers.dev subdomain
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      help: The workers.dev subdomain of the Cloudflare account the bot deploys into.
      example: acme
      # READ FROM THE CLOUDFLARE CONNECTION, not asked. The subdomain belongs
      # to the account the same way its id does, and there is exactly one
      # right answer — a typed one could only be wrong, and wrong showed up
      # after deploy, in the smoke checks and the verify URLs below. The
      # integration reads it from Cloudflare at connect and on its hourly
      # health check; the bootstrap door fills this input from the connection
      # the build is BOUND to, the same one CLOUDFLARE_ACCOUNT_ID and the
      # deploy tokens mint from, so all three name one account. The console
      # renders no field for it, and an account with no workers.dev subdomain
      # refuses the build at the door, naming the fix, before anything is
      # created.
      from: connection.cloudflare.workersSubdomain

  # ── PREVIEW ONLY. repo-blueprint.yaml's one `orun.integrations/reconcile@v1`
  # hook (`secrets`) mints these, brokered, during 01-product. ──────────────
  # Transcribed from that hook's own `secrets:` entries (each key and its
  # template), in its order, so testing/manifest.test.sh compares this list
  # to the document that mints them. The console renders them read-only: no
  # credential is ever typed, shown or stored. Keys that already exist are
  # kept. The KV namespace ids are not here: they are not credentials, and
  # the namespace's own apply publishes them. Nor is the bot token: nothing
  # mints it (above).
  secrets:
    - key: CLOUDFLARE_API_TOKEN
      provider: cloudflare
      template: workers-deploy
      why: Applies the KV namespace and deploys the Worker
    - key: CLOUDFLARE_ACCOUNT_ID
      provider: cloudflare
      template: account-id
      why: Connection fact, not a secret
      fact: true

  # ── PREVIEW ONLY. repo-blueprint.yaml's run-level `hooks.preInstantiate`
  # opens these — the epic, every milestone in this order, every task — before
  # the first phase places. Idempotent by identity, so a re-run finds what it
  # made before.
  programme:
    epicSlug: telegram-bot-baselining      # = repo-blueprint.yaml's `epicSlug` default
    epicName: "Telegram bot baselining — {productname}"
    milestones:
      # The whole product is one landing (01-product): the repository, the KV
      # root, the bot and its tests are one pull request and one convergence.
      - name: 01-product
      - name: 02-docs

  bootstrap:
    # THE BUILD DOCUMENT. There is no umbrella workflow and no agent brief:
    # every phase is declared in it and orun runs it.
    blueprint: repo-blueprint.yaml
    # Summed from the phases' expectedMinutes (7 + 1). An estimate until a
    # bootstrap measures it: no build of this baseline has been timed.
    expectedMinutes: 8
    tokenChannel: ORUN_TOKEN_FILE   # how a runner hands over its refreshed token
  verify:
    urls:
      - "https://{reponame}-bot-{env}.{subdomain}.workers.dev"
    envs: [stage, prod]
